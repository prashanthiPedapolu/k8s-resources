# cluster.yaml
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: roboshop-dev
  region: us-east-1

managedNodeGroups:
  - name: roboshop-dev
    instanceTypes: ["t3.medium", "t3.large"]
    on-demand: true
       # start on on-demand; add Spot later
    desiredCapacity: 2
    minSize: 1
    maxSize: 4
